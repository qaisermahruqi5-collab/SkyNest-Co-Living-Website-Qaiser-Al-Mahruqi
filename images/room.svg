<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Illustration of a furnished SKyNest room">
  <!-- wall and floor -->
  <rect width="1200" height="800" fill="#e8ece9"/>
  <rect y="560" width="1200" height="240" fill="#cfd8d3"/>
  <!-- window -->
  <rect x="120" y="110" width="300" height="260" rx="10" fill="#1f3b4d"/>
  <rect x="135" y="125" width="270" height="230" rx="6" fill="#bfe3e0"/>
  <path d="M135 300 L260 200 L405 290 L405 355 L135 355 Z" fill="#8fcfc9"/>
  <circle cx="340" cy="190" r="26" fill="#fff6c9"/>
  <rect x="268" y="125" width="6" height="230" fill="#1f3b4d"/>
  <rect x="135" y="238" width="270" height="6" fill="#1f3b4d"/>
  <!-- framed picture -->
  <rect x="560" y="140" width="220" height="150" rx="6" fill="#1f3b4d"/>
  <rect x="575" y="155" width="190" height="120" fill="#2a9d8f"/>
  <path d="M575 275 L640 215 L690 250 L730 225 L765 275 Z" fill="#1f3b4d"/>
  <!-- bed -->
  <rect x="470" y="330" width="560" height="60" rx="8" fill="#1f3b4d"/>
  <rect x="490" y="390" width="520" height="190" rx="14" fill="#ffffff"/>
  <rect x="490" y="470" width="520" height="110" rx="12" fill="#2a9d8f"/>
  <rect x="520" y="400" width="190" height="60" rx="14" fill="#f2f5f3"/>
  <rect x="740" y="400" width="190" height="60" rx="14" fill="#f2f5f3"/>
  <rect x="500" y="580" width="30" height="60" fill="#1f3b4d"/>
  <rect x="970" y="580" width="30" height="60" fill="#1f3b4d"/>
  <!-- bedside table and lamp -->
  <rect x="1060" y="470" width="90" height="110" rx="6" fill="#d9c7a8"/>
  <rect x="1090" y="430" width="30" height="40" fill="#1f3b4d"/>
  <path d="M1070 430 L1140 430 L1125 380 L1085 380 Z" fill="#f4d58d"/>
  <!-- plant -->
  <rect x="330" y="470" width="80" height="110" rx="8" fill="#d9c7a8"/>
  <ellipse cx="370" cy="440" rx="60" ry="40" fill="#2a9d8f"/>
  <ellipse cx="330" cy="415" rx="34" ry="26" fill="#2a9d8f"/>
  <ellipse cx="410" cy="410" rx="34" ry="26" fill="#2a9d8f"/>
  <!-- rug -->
  <ellipse cx="700" cy="700" rx="260" ry="40" fill="#b8c6bf"/>
</svg>
